<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc">
<title id="title">Intune assignment progression and All devices replacement</title><desc id="desc">Required includes accumulate as pilot rings activate. On activation of the final All devices ring, required Entra security group includes are replaced by All devices, while exclusions remain.</desc>
<rect width="1100" height="590" fill="#f3f7fd"/><rect x="30" y="30" width="1040" height="530" rx="12" fill="#fff" stroke="#cbd9ec"/><g font-family="Arial, Helvetica, sans-serif"><text x="65" y="82" fill="#132b4b" font-size="27" font-weight="700">What happens to Required assignments?</text><text x="65" y="111" fill="#65768f" font-size="16">Intune changes the underlying app or policy as each ring activates.</text></g>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="65" y="160" width="290" height="265" rx="10" fill="#eef5fd" stroke="#a9c5e5"/><text x="88" y="195" fill="#17345b" font-size="20" font-weight="700">Ring 1 active</text><rect x="88" y="225" width="244" height="58" rx="7" fill="#235b98"/><text x="105" y="261" fill="#fff" font-size="17">+ Engineering</text><text x="88" y="340" fill="#516780" font-size="15">Required includes: 1 group</text>
<path d="M364 292h38" stroke="#567fae" stroke-width="4"/><path d="m405 292-13-9v18z" fill="#567fae"/>
<rect x="405" y="160" width="290" height="265" rx="10" fill="#eef5fd" stroke="#a9c5e5"/><text x="428" y="195" fill="#17345b" font-size="20" font-weight="700">Ring 2 active</text><rect x="428" y="225" width="244" height="58" rx="7" fill="#235b98"/><text x="445" y="261" fill="#fff" font-size="17">Engineering</text><rect x="428" y="294" width="244" height="58" rx="7" fill="#367dc0"/><text x="445" y="330" fill="#fff" font-size="17">+ IT Pilot</text><text x="428" y="390" fill="#516780" font-size="15">Required includes: 2 groups</text>
<path d="M704 292h38" stroke="#567fae" stroke-width="4"/><path d="m745 292-13-9v18z" fill="#567fae"/>
<rect x="745" y="160" width="290" height="265" rx="10" fill="#e8f1fe" stroke="#86afe0"/><text x="768" y="195" fill="#17345b" font-size="20" font-weight="700">Final ring active</text><rect x="768" y="225" width="244" height="80" rx="7" fill="#17345b"/><text x="785" y="258" fill="#fff" font-size="17">All devices</text><text x="785" y="284" fill="#aedcff" font-size="14">replaces Required group includes</text><text x="768" y="390" fill="#516780" font-size="15">Existing exclusions remain</text>
<path d="M65 470H1035" stroke="#d2ddeb"/><text x="65" y="508" fill="#3b5678" font-size="16">Direct assignments need checking: a group present both on the payload and in a ring creates a collision.</text></g>
</svg>
