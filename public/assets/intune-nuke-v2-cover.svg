<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Intune Nuke, rebuilt</title><desc id="desc">Abstract dark blue EndpointLog cover showing five wizard steps from sign-in to nuke, with a backup step before deletion.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c30"/><stop offset="1" stop-color="#203961"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#bed8ff" opacity=".075"/></pattern><linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4aa5ff"/><stop offset="1" stop-color="#87d9ff"/></linearGradient><radialGradient id="red" cx=".4" cy=".35" r=".7"><stop stop-color="#ff8a7a"/><stop offset="1" stop-color="#e2382b"/></radialGradient></defs>
<rect width="1200" height="620" fill="url(#bg)"/><rect width="1200" height="620" fill="url(#grid)"/><circle cx="1050" cy="-50" r="390" fill="#3084ef" opacity=".075"/><circle cx="45" cy="650" r="290" fill="#45c0f5" opacity=".06"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="76" y="90" fill="#8ccaff" font-size="17" font-weight="700" letter-spacing="4">ENDPOINTLOG  /  BUILD</text><text x="76" y="167" fill="#ffffff" font-size="56" font-weight="750" letter-spacing="-2">The nuke button, rebuilt.</text><text x="78" y="207" fill="#b6cbe6" font-size="22">Know the tenant. Back up every object. Then delete.</text></g>
<path d="M150 410H900" fill="none" stroke="#4784bf" stroke-width="4" stroke-dasharray="9 9"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<g><circle cx="150" cy="410" r="44" fill="#203d65" stroke="#70c7ff" stroke-width="3"/><circle cx="150" cy="410" r="22" fill="url(#glow)"/><text x="150" y="418" fill="#102138" font-weight="800" font-size="22">1</text><text x="150" y="495" fill="#f5f9ff" font-size="17" font-weight="700">SIGN IN</text></g>
<g><circle cx="337" cy="410" r="44" fill="#203d65" stroke="#70c7ff" stroke-width="3"/><circle cx="337" cy="410" r="22" fill="url(#glow)"/><text x="337" y="418" fill="#102138" font-weight="800" font-size="22">2</text><text x="337" y="495" fill="#f5f9ff" font-size="17" font-weight="700">SCAN</text></g>
<g><circle cx="524" cy="410" r="44" fill="#203d65" stroke="#70c7ff" stroke-width="3"/><circle cx="524" cy="410" r="22" fill="url(#glow)"/><text x="524" y="418" fill="#102138" font-weight="800" font-size="22">3</text><text x="524" y="495" fill="#f5f9ff" font-size="17" font-weight="700">CHOOSE</text></g>
<g><circle cx="711" cy="410" r="52" fill="#203d65" stroke="#87d9ff" stroke-width="4"/><circle cx="711" cy="410" r="27" fill="url(#glow)"/><text x="711" y="419" fill="#102138" font-weight="800" font-size="24">4</text><text x="711" y="495" fill="#f5f9ff" font-size="17" font-weight="700">BACKUP</text><text x="711" y="518" fill="#9cbbdc" font-size="14">JSON per object</text></g>
<g><circle cx="960" cy="410" r="92" fill="#3a1d2a" stroke="#ff8a7a" stroke-width="3" opacity=".9"/><circle cx="960" cy="410" r="62" fill="url(#red)"/><circle cx="960" cy="402" r="62" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/><text x="960" y="418" fill="#ffffff" font-weight="800" font-size="24" letter-spacing="2">NUKE</text><text x="960" y="535" fill="#f5f9ff" font-size="17" font-weight="700">5  TYPE THE DOMAIN</text></g>
</g><path d="M76 575H1124" stroke="#739bc4" opacity=".4"/><text x="76" y="599" fill="#9cbbdc" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2">INTUNE-NUKE.PS1  ·  POWERSHELL 7  ·  MICROSOFT GRAPH</text>
</svg>
