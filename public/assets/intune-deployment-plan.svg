<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
<title id="title">Example four-ring deployment plan</title><desc id="desc">Endpoint Engineering starts, then IT Pilot after two days, Business Pilot after three additional days, and All Devices after five more days.</desc>
<rect width="1100" height="500" fill="#f3f7fd"/><rect x="30" y="30" width="1040" height="440" rx="12" fill="#fff" stroke="#cbd9ec"/><g font-family="Arial, Helvetica, sans-serif"><text x="70" y="86" fill="#132b4b" font-size="27" font-weight="700">One plan, four stages</text><text x="70" y="116" fill="#65768f" font-size="16">Example deferrals between ring activations</text></g>
<path d="M145 278H964" stroke="#94b3d6" stroke-width="5"/><path d="m965 278-15-10v20z" fill="#94b3d6"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<g><rect x="65" y="190" width="185" height="176" rx="12" fill="#17345b"/><text x="157" y="225" fill="#8fd2ff" font-size="13" font-weight="700" letter-spacing="2">RING 01</text><circle cx="157" cy="278" r="26" fill="#7dd1ff"/><text x="157" y="286" fill="#123356" font-size="22" font-weight="800">1</text><text x="157" y="337" fill="#fff" font-size="17" font-weight="700">Engineering</text></g>
<g><rect x="325" y="190" width="185" height="176" rx="12" fill="#245187"/><text x="417" y="225" fill="#c9eaff" font-size="13" font-weight="700" letter-spacing="2">RING 02</text><circle cx="417" cy="278" r="26" fill="#7dd1ff"/><text x="417" y="286" fill="#123356" font-size="22" font-weight="800">2</text><text x="417" y="337" fill="#fff" font-size="17" font-weight="700">IT Pilot</text></g>
<g><rect x="585" y="190" width="185" height="176" rx="12" fill="#2a66a5"/><text x="677" y="225" fill="#e2f3ff" font-size="13" font-weight="700" letter-spacing="2">RING 03</text><circle cx="677" cy="278" r="26" fill="#9bdcff"/><text x="677" y="286" fill="#123356" font-size="22" font-weight="800">3</text><text x="677" y="337" fill="#fff" font-size="17" font-weight="700">Business Pilot</text></g>
<g><rect x="845" y="190" width="185" height="176" rx="12" fill="#347cc5"/><text x="937" y="225" fill="#fff" font-size="13" font-weight="700" letter-spacing="2">RING 04</text><circle cx="937" cy="278" r="26" fill="#b7e8ff"/><text x="937" y="286" fill="#123356" font-size="22" font-weight="800">4</text><text x="937" y="337" fill="#fff" font-size="17" font-weight="700">All devices</text></g>
<g fill="#3e5977" font-size="14" font-weight="700"><text x="287" y="165">+ 2 days</text><text x="547" y="165">+ 3 days</text><text x="807" y="165">+ 5 days</text></g><text x="70" y="421" text-anchor="start" fill="#526883" font-size="16">The plan defines targeting and timing. A deployment adds the app or policy and first start time.</text></g>
</svg>
