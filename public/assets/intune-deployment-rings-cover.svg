<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Controlled Intune rollout across four rings</title><desc id="desc">Abstract dark blue EndpointLog cover with four progressively larger connected deployment stages.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c30"/><stop offset="1" stop-color="#203961"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#bed8ff" opacity=".075"/></pattern><linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4aa5ff"/><stop offset="1" stop-color="#87d9ff"/></linearGradient></defs>
<rect width="1200" height="620" fill="url(#bg)"/><rect width="1200" height="620" fill="url(#grid)"/><circle cx="1050" cy="-50" r="390" fill="#3084ef" opacity=".075"/><circle cx="45" cy="650" r="290" fill="#45c0f5" opacity=".06"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="76" y="90" fill="#8ccaff" font-size="17" font-weight="700" letter-spacing="4">ENDPOINTLOG  /  INTUNE</text><text x="76" y="167" fill="#ffffff" font-size="56" font-weight="750" letter-spacing="-2">A rollout with a plan.</text><text x="78" y="207" fill="#b6cbe6" font-size="22">Apps and policies move through rings on a schedule.</text></g>
<path d="M156 425H1040" fill="none" stroke="#4784bf" stroke-width="4" stroke-dasharray="9 9"/><path d="m1040 425-16-9v18z" fill="#4784bf"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<g><circle cx="178" cy="425" r="49" fill="#203d65" stroke="#70c7ff" stroke-width="3"/><circle cx="178" cy="425" r="25" fill="url(#glow)"/><text x="178" y="434" fill="#102138" font-weight="800" font-size="24">1</text><text x="178" y="516" fill="#f5f9ff" font-size="18" font-weight="700">IT</text></g>
<g><circle cx="444" cy="425" r="59" fill="#203d65" stroke="#70c7ff" stroke-width="3"/><circle cx="444" cy="425" r="29" fill="url(#glow)"/><text x="444" y="434" fill="#102138" font-weight="800" font-size="25">2</text><text x="444" y="516" fill="#f5f9ff" font-size="18" font-weight="700">PILOT</text></g>
<g><circle cx="710" cy="425" r="70" fill="#203d65" stroke="#70c7ff" stroke-width="3"/><circle cx="710" cy="425" r="34" fill="url(#glow)"/><text x="710" y="434" fill="#102138" font-weight="800" font-size="26">3</text><text x="710" y="516" fill="#f5f9ff" font-size="18" font-weight="700">PRODUCTION</text></g>
<g><circle cx="980" cy="425" r="83" fill="#203d65" stroke="#70c7ff" stroke-width="3"/><circle cx="980" cy="425" r="40" fill="url(#glow)"/><text x="980" y="434" fill="#102138" font-weight="800" font-size="28">4</text><text x="980" y="536" fill="#f5f9ff" font-size="18" font-weight="700">ALL DEVICES</text></g>
</g><path d="M76 575H1124" stroke="#739bc4" opacity=".4"/><text x="76" y="599" fill="#9cbbdc" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2">DEPLOYMENT PLANS  →  DEPLOYMENTS</text>
</svg>
